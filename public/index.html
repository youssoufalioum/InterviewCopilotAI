<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interview Copilot</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="glass-card hero-card">
        <h1>Interview Copilot</h1>
        <p>
          Assistant discret en temps réel pour entretiens techniques (audio micro + système).
        </p>

        <div class="controls-row">
          <button id="toggleAssistant" class="assistant-toggle" type="button">
            Démarrer l'Assistant
          </button>
          <span id="status" class="status-text">Prêt.</span>
        </div>
      </header>

      <section class="dashboard-grid">
        <article class="glass-card panel-card">
          <h2 class="title-cyan">Transcription en direct</h2>
          <div id="transcriptBox" class="output-box"></div>
        </article>

        <article class="glass-card panel-card">
          <h2 class="title-green">Suggestions de l'IA</h2>
          <div id="suggestionBox" class="output-box"></div>
        </article>
      </section>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
