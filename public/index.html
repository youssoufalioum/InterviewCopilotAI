<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interview Copilot</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="layout">
      <aside class="left-column card">
        <div class="video-surface">
          <div class="video-toolbar">
            <button id="fullscreenButton" type="button" class="chip">Fullscreen</button>
            <button id="changeTabButton" type="button" class="chip">Change Tab</button>
          </div>
          <div class="video-grid">
            <div id="previewStage" class="video-main preview-stage">
              <video id="previewVideo" class="preview-video" autoplay playsinline muted></video>
              <div id="previewPlaceholder" class="preview-placeholder">Screen / Meeting Preview</div>
            </div>
            <div class="video-side">Speaker Cam</div>
          </div>
        </div>

        <section class="transcript-panel">
          <div class="panel-head">
            <h2>Transcript</h2>
            <div class="head-actions">
              <button id="connectTranscriptButton" type="button" class="ghost-button">Connect</button>
              <button id="toggleMicrophoneButton" type="button" class="ghost-button">Activer micro</button>
              <button id="clearTranscriptButton" type="button" class="ghost-button">Clear</button>
            </div>
          </div>
          <div id="transcriptBox" class="chat-scroll transcript-box conversation-list"></div>
        </section>
      </aside>

      <section class="right-column card">
        <header class="assistant-header">
          <div class="assistant-brand">
            <span class="brand-dot"></span>
            <div>
              <h1>Interview Copilot</h1>
              <p id="status">Prêt.</p>
            </div>
          </div>

          <div class="assistant-controls">
            <select id="languageSelect" class="lang-select" aria-label="Langue de l'interview">
              <option value="fr">Français</option>
              <option value="en" selected>English</option>
              <option value="es">Español</option>
              <option value="de">Deutsch</option>
              <option value="it">Italiano</option>
              <option value="pt">Português</option>
            </select>
            <span id="timerPill" class="timer-pill">⏱ 00:00:00</span>
            <button id="toggleAssistant" class="assistant-toggle" type="button">Démarrer l'Assistant</button>
          </div>
        </header>

        <article class="answer-card">
          <div class="answer-card-head">
            <h3>⭐ Suggestions de l'IA</h3>
            <button id="downloadPdfButton" type="button" class="ghost-button">Télécharger PDF</button>
          </div>
          <div id="suggestionBox" class="chat-scroll suggestion-box"></div>
        </article>

        <footer class="bottom-actions">
          <button id="aiAnswerButton" type="button" class="cta-main">⚡ AI Answer</button>
          <label class="auto-switch" title="Active les réponses automatiques quand l'IA détecte une question dans la conversation.">
            <span class="auto-switch-label">Auto</span>
            <span class="switch-track">
              <input id="autoAssistToggle" type="checkbox" aria-label="Activer les réponses automatiques" />
              <span class="switch-thumb" aria-hidden="true"></span>
            </span>
          </label>
          <button type="button" class="cta-secondary">🖥 Analyze Screen</button>
        </footer>
      </section>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
